name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag (e.g., 1.2.3)"
        required: true
        type: string

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      # GHCR image names must be lowercase; the repository owner may not be.
      - name: Set lowercase image name
        env:
          REPO: ${{ github.repository }}
        run: echo "IMAGE=ghcr.io/${REPO,,}" >> "$GITHUB_ENV"

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Determine version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=${INPUT_VERSION#v}
          fi

          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: ${VERSION}" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building release version: ${VERSION}"
          {
            echo 'tags<<EOF'
            echo "${IMAGE}:${VERSION}"
            # Pre-releases such as 1.2.0-rc.1 never move latest.
            if [[ $VERSION != *-* ]]; then
              echo "${IMAGE}:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # No QEMU: every build stage runs on the runner and Go cross-compiles,
      # and the runtime stage has no RUN steps.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          provenance: false
          push: true
          platforms: linux/amd64
          tags: ${{ steps.version.outputs.tags }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The Android app and its update manifest, attached to a GitHub release. The
  # app reads releases/latest/download/latest.json, which skips pre-releases.
  android:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.image.outputs.version }}
      # The fingerprint of the release key. An update signed by anything else
      # would not install over the app, so never publish one.
      CERT_SHA256: 8ec2715ccac614775bfb9e8314b373fb5429e50f67abcc0b46d2292b881eee50

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build the signed APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          base64 --decode <<<"$KEYSTORE_BASE64" > "$ANDROID_KEYSTORE_FILE"
          ./gradlew assembleRelease "-PappVersion=${VERSION}"
          rm -f "$ANDROID_KEYSTORE_FILE"

      - name: Check the signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk \
            | grep -F "certificate SHA-256 digest: ${CERT_SHA256}"

      - name: Write the update manifest
        env:
          REPO: ${{ github.repository }}
        run: |
          APK="tingxie-${VERSION}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          IFS=. read -r MAJOR MINOR PATCH <<<"${VERSION%%-*}"
          jq -n \
            --arg version "$VERSION" \
            --argjson code "$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))" \
            --arg url "https://github.com/${REPO}/releases/download/v${VERSION}/${APK}" \
            --arg sha256 "$(sha256sum "$APK" | cut -d' ' -f1)" \
            --argjson size "$(stat -c %s "$APK")" \
            '{version: $version, version_code: $code, url: $url, sha256: $sha256, size: $size}' > latest.json
          cat latest.json

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "tingxie-${VERSION}.apk" latest.json --clobber
          else
            FLAGS=(--generate-notes --target "$GITHUB_SHA")
            if [[ $VERSION == *-* ]]; then FLAGS+=(--prerelease); fi
            gh release create "$TAG" "tingxie-${VERSION}.apk" latest.json "${FLAGS[@]}"
          fi

  # The Mac menu bar app, zipped onto the same release once the Android job
  # has created it. Mac clients learn of a new version from latest.json and
  # send the user to the release page.
  mac:
    needs: [image, android]
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.image.outputs.version }}
      # The certificate the app is signed with. macOS ties the Accessibility
      # permission to it, so an app signed by anything else would make every
      # user grant it again: never publish one.
      CERT_SHA256: fde59989901d061d9ef161b051565804a4bb1e6eb09754bf2d2fddc8f90651c9

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Test
        working-directory: mac
        run: swift test

      - name: Import the signing certificate
        env:
          P12_BASE64: ${{ secrets.MAC_SIGN_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_SIGN_P12_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KC_PASSWORD" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASSWORD" "$KC"
          base64 --decode <<<"$P12_BASE64" > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/signing.p12"
          # Lets codesign use the key without a prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASSWORD" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')

      - name: Build the signed app
        env:
          MAC_SIGN_IDENTITY: TingXie Code Signing
          UNIVERSAL: "1"
        run: ./mac/scripts/bundle.sh

      - name: Check the signature
        run: |
          codesign -d --extract-certificates="$RUNNER_TEMP/cert" mac/build/TingXie.app
          ACTUAL=$(shasum -a 256 "$RUNNER_TEMP/cert0" | cut -d' ' -f1)
          echo "certificate SHA-256: $ACTUAL"
          [[ $ACTUAL == "$CERT_SHA256" ]]
          lipo -archs mac/build/TingXie.app/Contents/MacOS/TingXie
          /usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' mac/build/TingXie.app/Contents/Info.plist

      - name: Publish to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="tingxie-mac-${VERSION}.zip"
          # ditto keeps the signature and extended attributes intact.
          ditto -c -k --keepParent mac/build/TingXie.app "$ZIP"
          gh release upload "v${VERSION}" "$ZIP" --clobber

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
