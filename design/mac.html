<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>听写 · Mac 原型</title>
<style>
/*
 * Mac 客户端原型：只有菜单栏图标，没有窗口。它常驻连接服务器，安卓端「发送到电脑」
 * 的文字插到当前光标处。token 沿用 pc.html；菜单本身尽量像系统菜单。
 * 整体风格选定系统菜单（NSMenu）；落选的「系统菜单 + 头部」「弹出面板」已删除。
 * 右下角「状态」菜单列出全部锚点（mac.html#<状态>，暗色加 dark- 前缀）。
 */
:root {
  color-scheme: light;
  --bg: #faf8f5;
  --surface: #ffffff;
  --ink: #1d1d1f;
  --ink-2: #6e6e73;
  --ink-3: #a1a1a6;
  --line: #ebe8e3;
  --hover: rgb(0 0 0 / 0.035);
  --selected: rgb(0 0 0 / 0.06);
  --chip: #f2f1ef;
  --accent: #1a7cf5;
  --rec: #f2544b;
  --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.05), 0 2px 8px -2px rgb(0 0 0 / 0.06);
  --shadow-lg: 0 2px 4px rgb(0 0 0 / 0.04), 0 24px 56px -16px rgb(0 0 0 / 0.22);
  --butter: #fbe69b;
  --periwinkle: #b6c4f4;
  --mint: #c6eac9;
  --mint-deep: oklch(from var(--mint) 0.6 calc(c * 1.8) h);
  --warn: #e8a33a;
  --paper: color-mix(in oklch, var(--butter) 10%, #fff);

  /* 系统界面（菜单栏、系统菜单、桌面）的颜色，不属于应用 token */
  --sys-bar: rgb(246 246 248 / 0.55);
  --sys-bar-ink: #1d1d1f;
  --sys-menu: rgb(246 246 248 / 0.78);
  --sys-menu-ink: #1d1d1f;
  --sys-menu-ink-2: rgb(0 0 0 / 0.5);
  --sys-menu-sep: rgb(0 0 0 / 0.1);
  --sys-menu-hl: #2f7cf6;
  --wall: linear-gradient(160deg, #b9c8e6 0%, #d9c3d5 45%, #efcfb3 100%);
  --win: #fff;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1b1b1d;
  --surface: #2a2a2d;
  --ink: #f2f2f4;
  --ink-2: #a0a0a7;
  --ink-3: #6c6c72;
  --line: #3a3a3e;
  --hover: rgb(255 255 255 / 0.04);
  --selected: rgb(255 255 255 / 0.08);
  --chip: #36363a;
  --accent: #3b8ef7;
  --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.3);
  --shadow-lg: 0 2px 4px rgb(0 0 0 / 0.3), 0 24px 56px -16px rgb(0 0 0 / 0.6);
  --mint-deep: oklch(from var(--mint) 0.8 calc(c * 1.4) h);
  --paper: color-mix(in oklch, var(--butter) 3%, var(--surface));
  --sys-bar: rgb(30 30 34 / 0.5);
  --sys-bar-ink: #f2f2f4;
  --sys-menu: rgb(40 40 44 / 0.8);
  --sys-menu-ink: #f2f2f4;
  --sys-menu-ink-2: rgb(255 255 255 / 0.5);
  --sys-menu-sep: rgb(255 255 255 / 0.1);
  --wall: linear-gradient(160deg, #222a3d 0%, #3a2c3c 50%, #4a3a2c 100%);
  --win: #1e1e20;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  min-height: 100vh; display: grid; place-items: center; padding: 24px 24px 72px;
  background: color-mix(in oklch, var(--bg), #000 7%); color: var(--ink);
  font: 13px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", sans-serif;
  -webkit-font-smoothing: antialiased;
}
:root[data-theme="dark"] body { background: #0e0e0f; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: default; }
svg { display: block; }
.icon { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- 桌面 ---------- */
.screen { position: relative; width: 1180px; height: 720px; border-radius: 14px; overflow: hidden; background: var(--wall); box-shadow: var(--shadow-lg); }
.bar { position: absolute; inset: 0 0 auto; height: 30px; display: flex; align-items: center; padding: 0 10px; gap: 2px;
  background: var(--sys-bar); backdrop-filter: blur(30px) saturate(1.6); color: var(--sys-bar-ink); font-size: 13px; z-index: 5; }
.bar .m { padding: 0 9px; height: 24px; display: flex; align-items: center; border-radius: 6px; }
.bar .m.b { font-weight: 700; }
.bar .sp { flex: 1; }
.bar .st { height: 24px; min-width: 30px; padding: 0 7px; display: grid; place-items: center; border-radius: 6px; position: relative; }
.bar .st.open { background: rgb(127 127 127 / 0.28); }
.bar .clock { padding: 0 8px; font-variant-numeric: tabular-nums; }
.bar .st svg.sys { width: 17px; height: 17px; fill: currentColor; stroke: none; }

/* 菜单栏图标：logo 的单色剪影，写字的三道横线挖空 */
.tray { width: 19px; height: 18px; color: var(--sys-bar-ink); }
.tray.dim { opacity: .4; }
.tray-badge { position: absolute; right: 4px; top: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 0 1.5px var(--sys-bar); }


/* 背后的文稿窗口，演示插入位置 */
.win { position: absolute; left: 90px; top: 110px; width: 620px; height: 420px; border-radius: 12px; background: var(--win); box-shadow: 0 0 0 0.5px rgb(0 0 0 / .2), 0 20px 50px -12px rgb(0 0 0 / .35); overflow: hidden; }
.win .tb { height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-bottom: 1px solid var(--line); color: var(--ink-2); font-size: 13px; }
.win .tb i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; } .win .tb i:nth-child(2) { background: #febc2e; } .win .tb i:nth-child(3) { background: #28c840; }
.win .tb span { flex: 1; text-align: center; margin-right: 52px; }
.win .body { padding: 22px 28px; font-size: 14px; line-height: 1.75; color: var(--ink); }
.win .body p { margin: 0 0 10px; }
.caret { display: inline-block; width: 1.5px; height: 1.1em; vertical-align: -0.15em; background: var(--accent); animation: blink 1s steps(1) infinite; }
.ins { background: color-mix(in oklch, var(--accent) 16%, transparent); border-radius: 3px; }
@keyframes blink { 50% { opacity: 0; } }

/* ---------- 菜单：原生 NSMenu ---------- */
.menu { position: absolute; top: 34px; z-index: 6; min-width: 268px; padding: 5px; border-radius: 12px;
  background: var(--sys-menu); backdrop-filter: blur(40px) saturate(1.8); color: var(--sys-menu-ink);
  box-shadow: 0 0 0 0.5px rgb(0 0 0 / .18), inset 0 0 0 0.5px rgb(255 255 255 / .25), 0 12px 40px -8px rgb(0 0 0 / .3); font-size: 13px; }
.menu .it { height: 24px; padding: 0 10px 0 24px; border-radius: 6px; display: flex; align-items: center; gap: 8px; position: relative; white-space: nowrap; }
.menu .it:not(.off):hover, .menu .it.hl { background: var(--sys-menu-hl); color: #fff; }
.menu .it:not(.off):hover .k, .menu .it.hl .k, .menu .it:not(.off):hover .sub { color: rgb(255 255 255 / .8); }
.menu .it.off { color: var(--sys-menu-ink-2); }
.menu .it .k { margin-left: auto; color: var(--sys-menu-ink-2); font-variant-numeric: tabular-nums; padding-left: 18px; }
.menu .it .tick { position: absolute; left: 8px; width: 12px; height: 12px; stroke-width: 2.4; }
.menu .it .lead { position: absolute; left: 8px; width: 8px; height: 8px; border-radius: 50%; }
.menu .it .ic { width: 15px; height: 15px; margin-left: -18px; margin-right: 3px; }
.menu .it .txt { overflow: hidden; text-overflow: ellipsis; max-width: 230px; }
.menu .hd { padding: 6px 10px 2px 24px; font-size: 11px; font-weight: 600; color: var(--sys-menu-ink-2); }
.menu .sep { height: 1px; margin: 5px 10px; background: var(--sys-menu-sep); }
.menu .it.warn .ic { color: var(--warn); }
.menu .it.warn:hover .ic { color: #fff; }


/* 状态圆点 */
.ok { background: var(--mint-deep); }
.wait { background: var(--ink-3); }
.bad { background: var(--warn); }


/* ---------- 系统对话框（NSAlert）和系统权限提示 ---------- */
.dim-bg { position: absolute; inset: 30px 0 0; z-index: 7; display: grid; place-items: start center; padding-top: 120px; }
.alert { width: 260px; padding: 20px 16px 16px; border-radius: 18px; text-align: center;
  background: var(--sys-menu); backdrop-filter: blur(40px) saturate(1.8); color: var(--sys-menu-ink);
  box-shadow: 0 0 0 0.5px rgb(0 0 0 / .2), 0 24px 60px -12px rgb(0 0 0 / .45); }
.alert .a-icon { width: 56px; height: 56px; margin: 0 auto 10px; border-radius: 13px; display: grid; place-items: center; background: var(--paper); box-shadow: 0 1px 3px rgb(0 0 0 / .15); }
:root[data-theme="dark"] .alert .a-icon { background: var(--chip); }
.alert .a-icon .logo { width: 36px; }
.alert h3 { margin: 0 0 4px; font-size: 13px; font-weight: 700; }
.alert p { margin: 0 0 14px; font-size: 11.5px; line-height: 1.45; color: var(--sys-menu-ink-2); }
.alert input { width: 100%; height: 24px; margin: -4px 0 14px; padding: 0 7px; border-radius: 6px; border: 0; font: inherit; font-size: 12px; color: var(--sys-menu-ink);
  background: rgb(127 127 127 / 0.14); box-shadow: inset 0 0 0 0.5px rgb(127 127 127 / .35), 0 0 0 3px color-mix(in oklch, var(--sys-menu-hl) 45%, transparent); outline: none; }
.alert .a-err { margin: -10px 0 12px; font-size: 11px; color: #e5484d; }
.alert .a-btns { display: flex; flex-direction: column; gap: 7px; }
.alert .a-btns.row { flex-direction: row; }
.alert .a-btns button { flex: 1; height: 26px; border-radius: 999px; font-size: 12.5px; background: rgb(127 127 127 / 0.18); }
.alert .a-btns button.def { background: var(--sys-menu-hl); color: #fff; }
.alert .a-btns button.danger { color: #e5484d; }

/* ---------- 浏览器窗口：登录回调页（客户端在 127.0.0.1 上自己返回的页面） ---------- */
.browser { position: absolute; left: 230px; top: 80px; width: 720px; height: 520px; z-index: 4; border-radius: 12px; overflow: hidden; background: var(--bg);
  box-shadow: 0 0 0 0.5px rgb(0 0 0 / .2), 0 24px 60px -12px rgb(0 0 0 / .4); display: flex; flex-direction: column; }
.browser .b-tb { height: 44px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: var(--win); border-bottom: 1px solid var(--line); }
.browser .b-tb i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; } .browser .b-tb i:nth-child(2) { background: #febc2e; } .browser .b-tb i:nth-child(3) { background: #28c840; }
.browser .url { margin: 0 auto; width: 340px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-size: 12.5px; color: var(--ink-2); background: var(--chip); }
.browser .page { flex: 1; display: grid; place-items: center; padding: 24px; }
.cb-card { width: 100%; max-width: 380px; padding: 28px 28px 24px; border-radius: 20px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line), var(--shadow-lg); font-size: 14px; }
.cb-brand { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
.cb-brand .brand-mark { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--surface); box-shadow: var(--shadow-sm); }
:root[data-theme="dark"] .cb-brand .brand-mark { background: var(--chip); }
.cb-brand .logo { width: 24px; }
.brand-name { font: 700 18px/1 "Songti SC", "Noto Serif SC", serif; display: inline-flex; align-items: center; gap: 4px; }
.brand-dot { width: 3px; height: 3px; border-radius: 50%; background: currentColor; }
.result { text-align: center; padding: 8px 0 4px; }
.mark { width: 44px; height: 44px; margin: 0 auto 14px; border-radius: 50%; display: grid; place-items: center; background: var(--chip); color: var(--ink-2); }
.mark .icon { width: 20px; height: 20px; }
.mark.ok { background: color-mix(in oklch, var(--accent) 14%, var(--surface)); color: var(--accent); }
.result h1 { margin: 0 0 6px; font-size: 18px; font-weight: 600; line-height: 1.4; }
.result p { margin: 0; font-size: 13px; color: var(--ink-2); }

/* ---------- 原型专用：右下角状态菜单（不是界面的一部分） ---------- */
.states-btn { position: fixed; right: 16px; bottom: 16px; z-index: 100; height: 32px; padding: 0 12px; border-radius: 999px; cursor: pointer;
  display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); background: var(--surface); box-shadow: inset 0 0 0 1px var(--line), var(--shadow-lg); }
.states { position: fixed; right: 16px; bottom: 56px; z-index: 100; width: 252px; max-height: calc(100vh - 80px); overflow: auto; padding: 5px; border-radius: 12px;
  background: var(--surface); box-shadow: inset 0 0 0 1px var(--line), var(--shadow-lg); scrollbar-width: thin; font-size: 13px; }
.states h4 { margin: 0; padding: 8px 10px 3px; font-size: 11.5px; font-weight: 500; color: var(--ink-3); }
.states button { width: 100%; height: 28px; padding: 0 10px; border-radius: 7px; display: flex; align-items: center; gap: 8px; text-align: left; font-size: 13px; cursor: pointer; }
.states button:hover { background: var(--hover); }
.states button[aria-current="true"] { background: var(--selected); font-weight: 500; }
.states button code { margin-left: auto; font: 11px ui-monospace, "SF Mono", Menlo, monospace; color: var(--ink-3); }
.states .toggle { justify-content: space-between; }
</style>
</head>

<script>
const $ = (id) => document.getElementById(id);
const root = document.documentElement;
const ME = { name: 'Eric Wang', email: 'eric@onlyquant.top' };
const MAC = 'Eric 的 MacBook Pro';
const HOST = 'tingxie.onlyquant.top';
const RECENT = [
  { t: '帮我把周五的会议改到下午三点，顺便通知一下设计组的同事。', at: '14:32' },
  { t: '下周二之前把发布说明整理出来，重点写更新方式的变化。', at: '14:05' },
  { t: '好的，收到。', at: '昨天' },
];

/*
 * 菜单栏图标：on 正常；dim 变淡（未登录、没连上）；badge 右上角橙点（缺少辅助功能权限）。
 * 菜单内容由状态决定，见 menu()。
 */
const S = {
  connected: { tray: 'on', label: '已连接', dot: 'ok' },
  empty: { tray: 'on', label: '已连接', dot: 'ok', recent: [] },
  connecting: { tray: 'dim', label: '正在连接…', dot: 'wait' },
  offline: { tray: 'dim', label: '连不上服务器，正在重试', dot: 'bad' },
  permission: { tray: 'badge', label: '已连接', dot: 'ok', needPerm: true },
  update: { tray: 'on', label: '已连接', dot: 'ok', update: '0.8.0' },
  'logged-out': { tray: 'dim', loggedOut: true },
  'logging-in': { tray: 'dim', loggedOut: true, busy: true },
  expired: { tray: 'dim', loggedOut: true, msg: '登录已失效，请重新登录' },
};

const ic = (id, cls = 'icon ic') => `<svg class="${cls}"><use href="#${id}"/></svg>`;
const tick = `${ic('i-check', 'icon tick')}`;
const logo = '<svg class="logo" viewBox="0 1 398 383"><use href="#logo"/></svg>';

function menu(s) {
  const tail = (s.update ? `<div class="it">有新版本 ${s.update}…</div>` : '') + `<div class="it">退出听·写<span class="k">⌘Q</span></div>`;
  let h = '';
  if (s.loggedOut) {
    h += `<div class="it off">${s.msg || '未登录'}</div><div class="sep"></div>`;
    h += s.busy ? `<div class="it off">${ic('i-loader', 'icon ic spin')}正在浏览器中登录…</div><div class="it">取消登录</div>` : `<div class="it">登录…</div>`;
    h += `<div class="it">服务器：${HOST}…</div><div class="sep"></div>`;
    h += `<div class="it">${tick}开机时启动</div><div class="sep"></div>${tail}`;
    return `<div class="menu">${h}</div>`;
  }
  const recent = s.recent || RECENT;
  h += `<div class="it off"><span class="lead ${s.dot}"></span>${s.label}</div>`;
  h += `<div class="it off">这台 Mac：${MAC}</div><div class="sep"></div>`;
  if (s.needPerm) h += `<div class="it warn">${ic('i-alert')}开启辅助功能权限才能插入文字…</div><div class="sep"></div>`;
  h += `<div class="hd">最近插入（点击复制）</div>`;
  h += recent.length ? recent.map((r) => `<div class="it"><span class="txt">${r.t}</span><span class="k">${r.at}</span></div>`).join('')
    : `<div class="it off">还没有收到文字</div>`;
  h += `<div class="sep"></div><div class="it">${tick}开机时启动</div><div class="sep"></div>`;
  h += `<div class="it off">${ME.name}（${ME.email}）</div><div class="it">退出登录…</div><div class="sep"></div>${tail}`;
  return `<div class="menu">${h}</div>`;
}

// 系统对话框：kind 决定内容
const DLG = {
  server: () => `<h3>服务器地址</h3><p>局域网开发服务可以填 http://IP:端口</p><input value="https://${HOST}"><div class="a-btns row"><button>取消</button><button class="def">保存</button></div>`,
  'server-error': () => `<h3>服务器地址</h3><p>局域网开发服务可以填 http://IP:端口</p><input value="https://tingxie.example"><div class="a-err">连不上这个服务器</div><div class="a-btns row"><button>取消</button><button class="def">保存</button></div>`,
  logout: () => `<h3>退出登录？</h3><p>退出后这台 Mac 不再接收安卓端发送的文字。</p><div class="a-btns row"><button>取消</button><button class="def">退出登录</button></div>`,
  'perm-prompt': () => `<h3>“听·写”想使用辅助功能控制这台电脑。</h3><p>在“隐私与安全性”设置中为此应用授予访问权限。</p><div class="a-btns"><button class="def">打开系统设置</button><button>拒绝</button></div>`,
};

// 浏览器里的登录回调页：确认页跳回 127.0.0.1，由客户端自己返回这个页面
const CB = {
  'callback-ok': ['ok', 'i-check', '已登录', '可以关闭这个页面，回到听·写'],
  'callback-denied': ['', 'i-x', '已取消登录', '可以关闭这个页面'],
  'callback-error': ['', 'i-x', '登录失败', '请回到听·写重新登录'],
};

function render(state) {
  const s = S[state] || S.connected;
  $('trayIcon').classList.toggle('dim', s.tray === 'dim');
  $('trayBadge').hidden = s.tray !== 'badge';
  const inserted = state === 'inserted';
  $('winBody').innerHTML = `<p>本周进度：登录和推送已经联调完。</p><p>待办：${inserted ? `<span class="ins">${RECENT[0].t}</span>` : ''}<span class="caret"></span></p>`;
  const open = !inserted && !DLG[state] && !CB[state];
  $('trayBtn').classList.toggle('open', open);
  if (open) {
    $('pop').innerHTML = menu(s);
    const pop = $('pop').firstElementChild;
    const scr = $('screen').getBoundingClientRect(), b = $('trayBtn').getBoundingClientRect();
    pop.style.left = Math.min(b.left - scr.left, scr.width - pop.offsetWidth - 8) + 'px';
  }
  if (DLG[state]) $('dlg').innerHTML = `<div class="dim-bg"><div class="alert"><div class="a-icon">${logo}</div>${DLG[state]()}</div></div>`;
  if (CB[state]) {
    const [cls, icon, title, msg] = CB[state];
    $('browser').innerHTML = `<div class="browser"><div class="b-tb"><i></i><i></i><i></i><span class="url">127.0.0.1</span></div><div class="page"><main class="cb-card">
      <div class="cb-brand"><div class="brand-mark">${logo}</div><div class="brand-name"><span>听</span><span class="brand-dot"></span><span>写</span></div></div>
      <section class="result"><div class="mark ${cls}">${ic(icon, 'icon')}</div><h1>${title}</h1><p>${msg}</p></section></main></div></div>`;
  }
}

// 直接打开某个状态：mac.html#<状态>，暗色加 dark- 前缀
const GROUPS = [
  ['菜单', [['已连接', 'connected'], ['没有记录', 'empty'], ['正在连接', 'connecting'], ['连不上服务器', 'offline'], ['缺少辅助功能权限', 'permission'], ['有新版本', 'update'], ['刚插入文字（菜单关闭）', 'inserted']]],
  ['登录', [['未登录', 'logged-out'], ['正在浏览器中登录', 'logging-in'], ['登录已失效', 'expired'], ['回调页：已登录', 'callback-ok'], ['回调页：已取消', 'callback-denied'], ['回调页：登录失败', 'callback-error'], ['改服务器', 'server'], ['服务器连不上', 'server-error'], ['退出登录', 'logout']]],
  ['系统', [['辅助功能权限提示', 'perm-prompt']]],
];
const dark = location.hash.slice(1).startsWith('dark');
const state = location.hash.slice(1).replace(/^dark-?/, '') || 'connected';
if (dark) root.dataset.theme = 'dark';
render(state);
addEventListener('hashchange', () => location.reload());

if (!navigator.webdriver) {
  const go = (st, d) => { location.hash = [d ? 'dark' : '', st].filter(Boolean).join('-') || '_'; };
  const btn = document.createElement('button'); btn.className = 'states-btn'; btn.innerHTML = `${ic('i-more', 'icon')}状态`;
  const menuEl = document.createElement('div'); menuEl.className = 'states'; menuEl.hidden = true;
  const t = document.createElement('button'); t.className = 'toggle'; t.textContent = dark ? '暗色 ✓' : '暗色'; t.onclick = () => go(state, !dark); menuEl.append(t);
  for (const [name, items] of GROUPS) {
    const h = document.createElement('h4'); h.textContent = name; menuEl.append(h);
    for (const [label, st] of items) {
      const b = document.createElement('button'); b.innerHTML = `${label}<code>#${st}</code>`;
      if (st === state) b.setAttribute('aria-current', 'true');
      b.onclick = () => go(st, dark); menuEl.append(b);
    }
  }
  btn.onclick = (e) => { e.stopPropagation(); menuEl.hidden = !menuEl.hidden; };
  menuEl.onclick = (e) => e.stopPropagation();
  document.addEventListener('click', () => { menuEl.hidden = true; });
  document.body.append(btn, menuEl);
}
</script>
</body>
</html>
