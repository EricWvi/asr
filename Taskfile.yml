version: "3"

# Local secrets such as ASR_DASHSCOPE_API_KEY live in .env (git-ignored).
dotenv: [".env"]

tasks:
  default:
    cmds:
      - task: list

  list:
    desc: List all tasks in the current project
    cmds:
      - task --list

  ###################################################
  ############## Install Dependencies ###############
  ###################################################

  install:frontend:
    desc: Install locked frontend dependencies (Node 24+)
    dir: frontend
    cmds:
      - npm ci

  install:go:
    desc: Download Go module dependencies
    cmds:
      - go mod download

  ###################################################
  ############## Clean and Build Tasks ##############
  ###################################################

  build:
    desc: Build the release binary with the frontend embedded (release/asr)
    cmds:
      - ./scripts/build.sh

  build:frontend:
    desc: Build the frontend static dist
    dir: frontend
    cmds:
      - npm run build

  build:go:
    desc: Compile all Go packages
    cmds:
      - go build ./...

  clean:
    desc: Remove release binaries and the built frontend dist
    cmds:
      - rm -rf release
      - find frontend/dist -mindepth 1 ! -name .gitkeep -delete

  format:
    desc: Format all Go sources
    cmds:
      - task: format:go

  format:go:
    desc: Format Go sources with gofmt
    cmds:
      - gofmt -w cmd internal frontend.go

  lint:
    desc: Run all linters
    cmds:
      - task: lint:frontend
      - task: lint:go

  lint:frontend:
    desc: Typecheck frontend source
    dir: frontend
    cmds:
      - npm run typecheck

  lint:go:
    desc: Check gofmt and run go vet, including the authelia-tagged tests
    silent: true
    cmds:
      - |
        unformatted=$(gofmt -l cmd internal frontend.go)
        if [ -n "$unformatted" ]; then
          echo "gofmt needed (run task format):"
          echo "$unformatted"
          exit 1
        fi
      - go vet ./...
      - go vet -tags authelia ./internal/auth

  test:
    desc: Run all lint and unit tests (container tests are excluded)
    cmds:
      - task: lint
      - task: test:go

  test:go:
    desc: Run Go unit and HTTP tests
    cmds:
      - go test ./...

  ###################################################
  ################ Container Tests ##################
  ###################################################

  test:contract:
    desc: Run the Authelia contract test using locally prepared images
    cmds:
      - go test -tags authelia ./internal/auth

  ###################################################
  ############# Run Development Servers #############
  ###################################################

  run:web:
    desc: Start the Vite frontend development server
    dir: frontend
    cmds:
      - npm run dev

  run:server:
    desc: Run the ASR server with config.yaml in the project root
    cmds:
      - go run ./cmd/asr {{.CLI_ARGS}}
